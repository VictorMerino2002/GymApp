service: gym-api

provider:
  name: aws
  runtime: provided.al2023
  architecture: x86_64
  region: ${opt:region, 'eu-west-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  httpApi:
    cors:
      allowedOrigins: ${self:custom.cors.origins.${sls:stage}}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: false
      maxAge: 600
  environment:
    RUST_LOG: info
    JWT_SECRET: ${ssm:/${self:service}/${sls:stage}/jwt-secret}
    USERS_TABLE: ${self:custom.tables.users}
    ACTIVITIES_TABLE: ${self:custom.tables.activities}
    EXERCISES_TABLE: ${self:custom.tables.exercises}
    EXERCISE_HISTORY_TABLE: ${self:custom.tables.exerciseHistory}
    ROUTINES_TABLE: ${self:custom.tables.routines}
    SESSIONS_TABLE: ${self:custom.tables.sessions}
    FAV_ROUTINES_TABLE: ${self:custom.tables.favRoutines}
    FAV_SESSIONS_TABLE: ${self:custom.tables.favSessions}
    FRIENDSHIPS_TABLE: ${self:custom.tables.friendships}
    MEDIA_BUCKET: !Ref MediaBucket
    MEDIA_BASE_URL: !Join ['', ['https://', !GetAtt MediaDistribution.DomainName]]
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:ConditionCheckItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-${sls:stage}-*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-${sls:stage}-*/index/*
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - !Join ['', [!GetAtt MediaBucket.Arn, '/*']]

custom:
  cors:
    origins:
      dev:
        - http://localhost:5173
        - http://localhost:4173
  throttling:
    default:
      rate: 50
      burst: 100
    auth:
      rate: 5
      burst: 10
  media:
    bucket: ${self:service}-${sls:stage}-media-${aws:accountId}
  tables:
    users: ${self:service}-${sls:stage}-users
    activities: ${self:service}-${sls:stage}-activities
    exercises: ${self:service}-${sls:stage}-exercises
    exerciseHistory: ${self:service}-${sls:stage}-exercise-history
    routines: ${self:service}-${sls:stage}-routines
    sessions: ${self:service}-${sls:stage}-sessions
    favRoutines: ${self:service}-${sls:stage}-fav-routines
    favSessions: ${self:service}-${sls:stage}-fav-sessions
    friendships: ${self:service}-${sls:stage}-friendships

package:
  individually: true

functions:
  api:
    handler: bootstrap
    package:
      artifact: target/lambda/api/bootstrap.zip
    events:
      - httpApi: '*'
      - httpApi:
          method: POST
          path: /auth/login
      - httpApi:
          method: POST
          path: /auth/register

resources:
  extensions:
    HttpApiStage:
      DependsOn:
        - HttpApiRoutePostAuthLogin
        - HttpApiRoutePostAuthRegister
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: ${self:custom.throttling.default.rate}
          ThrottlingBurstLimit: ${self:custom.throttling.default.burst}
        RouteSettings:
          POST /auth/login:
            ThrottlingRateLimit: ${self:custom.throttling.auth.rate}
            ThrottlingBurstLimit: ${self:custom.throttling.auth.burst}
          POST /auth/register:
            ThrottlingRateLimit: ${self:custom.throttling.auth.rate}
            ThrottlingBurstLimit: ${self:custom.throttling.auth.burst}

  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.users}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: search_pk
            AttributeType: S
          - AttributeName: username_lower
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: username-search-index
            KeySchema:
              - AttributeName: search_pk
                KeyType: HASH
              - AttributeName: username_lower
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    ActivitiesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.activities}
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE

    ExercisesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.exercises}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    ExerciseHistoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.exerciseHistory}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE

    RoutinesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.routines}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: author_id
            AttributeType: S
          - AttributeName: created_at
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: author-index
            KeySchema:
              - AttributeName: author_id
                KeyType: HASH
              - AttributeName: created_at
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    SessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.sessions}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: author_id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: author-index
            KeySchema:
              - AttributeName: author_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    FavRoutinesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.favRoutines}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: routine_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
          - AttributeName: routine_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: routine-index
            KeySchema:
              - AttributeName: routine_id
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY

    FavSessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.favSessions}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: session_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
          - AttributeName: session_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: session-index
            KeySchema:
              - AttributeName: session_id
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY

    FriendshipsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tables.friendships}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user1_id
            AttributeType: S
          - AttributeName: user2_id
            AttributeType: S
        KeySchema:
          - AttributeName: user1_id
            KeyType: HASH
          - AttributeName: user2_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: user2-index
            KeySchema:
              - AttributeName: user2_id
                KeyType: HASH
              - AttributeName: user1_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    MediaBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.media.bucket}
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        CorsConfiguration:
          CorsRules:
            - AllowedMethods:
                - PUT
              AllowedOrigins:
                - '*'
              AllowedHeaders:
                - content-type
                - content-length
              MaxAge: 3000

    MediaOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${sls:stage}-media
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    MediaDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:service}-${sls:stage} media
          PriceClass: PriceClass_100
          HttpVersion: http2and3
          Origins:
            - Id: media-bucket
              DomainName: !GetAtt MediaBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt MediaOriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ''
          DefaultCacheBehavior:
            TargetOriginId: media-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

    MediaBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref MediaBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Join ['', [!GetAtt MediaBucket.Arn, '/*']]
              Condition:
                StringEquals:
                  AWS:SourceArn: !Join ['', ['arn:aws:cloudfront::${aws:accountId}:distribution/', !Ref MediaDistribution]]

  Outputs:
    MediaBucketName:
      Value: !Ref MediaBucket
    MediaBaseUrl:
      Value: !Join ['', ['https://', !GetAtt MediaDistribution.DomainName]]
