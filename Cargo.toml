[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
axum = "0.8"
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
lambda_http = "1.3.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
aws-config = { version = "1.13.3", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.140.0"
aws-sdk-s3 = "1.161.0"
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }

argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
uuid = { version = "1", features = ["v4", "v7"] }

[[bin]]
name = "set-role"
path = "src/scripts/set_role.rs"
